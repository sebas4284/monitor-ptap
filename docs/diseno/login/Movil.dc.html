<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Aquora · Ingreso celular</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#04101A}
a{color:#7CC4EC}a:hover{color:#B5DEF5}
@keyframes aqDrift{from{transform:translateX(0)}to{transform:translateX(-50%)}}
@keyframes aqRise{from{transform:translateY(100%)}to{transform:translateY(0)}}
@keyframes aqRipple{0%{transform:scale(.55);opacity:.55}100%{transform:scale(1.9);opacity:0}}
@keyframes aqBubble{0%{transform:translateY(0);opacity:0}15%{opacity:.7}100%{transform:translateY(-300px);opacity:0}}
@keyframes aqFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes aqFadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
@keyframes aqPulse{0%,100%{opacity:1}50%{opacity:.35}}
.aq-wave{position:absolute;left:0;top:0;width:200%;animation:aqDrift linear infinite}
.aq-ring{position:absolute;border-radius:50%;border:1.5px solid #2491CC;animation:aqRipple 4.5s ease-out infinite}
.aq-bubble{position:absolute;bottom:20px;border-radius:50%;border:1px solid rgba(181,222,245,.55);background:rgba(181,222,245,.08);animation:aqBubble linear infinite}
.aq-field input{width:100%;box-sizing:border-box;height:52px;border-radius:12px;border:1.5px solid #24384A;background:#0A1C2A;color:#F2F7FA;font:400 16px Poppins,sans-serif;padding:0 48px 0 46px;outline:none;transition:border-color .2s,box-shadow .2s}
.aq-field input::placeholder{color:#7B8C99}
.aq-field input:focus{border-color:#2491CC;box-shadow:0 0 0 4px rgba(36,145,204,.22)}
.aq-btn:active{transform:scale(.985)}
@media (prefers-reduced-motion: reduce){.aq-wave,.aq-ring,.aq-bubble,.aq-anim{animation:none!important}}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; font-family: Poppins, sans-serif; color: #F2F7FA; background: #04101A">

<div aria-hidden="true" style="position: absolute; left: 0; right: 0; top: 0; height: 330px; background: #061827; overflow: hidden">
<div class="aq-anim" style="position: absolute; left: 0; right: 0; bottom: 0; height: 120px; animation: aqRise 2.2s cubic-bezier(.2,.7,.2,1) both">
<span class="aq-bubble" style="left: 14%; width: 8px; height: 8px; animation-duration: 7s"></span>
<span class="aq-bubble" style="left: 38%; width: 5px; height: 5px; animation-duration: 6s; animation-delay: 2s"></span>
<span class="aq-bubble" style="left: 70%; width: 10px; height: 10px; animation-duration: 8s; animation-delay: 1s"></span>
<span class="aq-bubble" style="left: 88%; width: 6px; height: 6px; animation-duration: 6.5s; animation-delay: 3.5s"></span>
</div>
</div>

<div class="aq-anim" aria-hidden="true" style="position: absolute; left: 0; right: 0; top: 250px; height: 110px; overflow: hidden; animation: aqFadeUp 1.4s .2s both">
<svg class="aq-wave" viewBox="0 0 1560 110" preserveAspectRatio="none" style="height: 110px; animation-duration: 14s"><path d="M0 40 Q97.5 0 195 40 T390 40 T585 40 T780 40 T975 40 T1170 40 T1365 40 T1560 40 V0 H0 Z" fill="#0B3A5C"></path></svg>
<svg class="aq-wave" viewBox="0 0 1560 110" preserveAspectRatio="none" style="height: 92px; animation-duration: 9s; animation-direction: reverse"><path d="M0 30 Q130 70 260 30 T520 30 T780 30 T1040 30 T1300 30 T1560 30 V0 H0 Z" fill="#12608F" fill-opacity="0.75"></path></svg>
<svg class="aq-wave" viewBox="0 0 1560 110" preserveAspectRatio="none" style="height: 70px; animation-duration: 6s"><path d="M0 20 Q65 50 130 20 T260 20 T390 20 T520 20 T650 20 T780 20 T910 20 T1040 20 T1170 20 T1300 20 T1430 20 T1560 20 V0 H0 Z" fill="#061827"></path></svg>
</div>

<div style="position: absolute; left: 0; right: 0; top: 34px; display: flex; flex-direction: column; align-items: center; gap: 8px">
<div class="aq-anim" style="position: relative; width: 200px; height: 168px; display: flex; align-items: center; justify-content: center; animation: aqFloat 6s ease-in-out infinite">
<span class="aq-ring" aria-hidden="true" style="width: 150px; height: 150px; left: 25px; top: -12px"></span>
<span class="aq-ring" aria-hidden="true" style="width: 150px; height: 150px; left: 25px; top: -12px; animation-delay: 1.5s"></span>
<span class="aq-ring" aria-hidden="true" style="width: 150px; height: 150px; left: 25px; top: -12px; animation-delay: 3s"></span>
<img src="/_blob/4ce09daf0f394db755966491555c8841" alt="Aquora, creado por XPERTIC" style="position: relative; width: 200px; height: 168px; object-fit: contain">
</div>
<p class="aq-anim" style="margin: 0; font-size: 14px; color: #A9C0CF; animation: aqFadeUp .8s .5s both">El agua de 12 plantas, en tiempo real</p>
</div>

<form class="aq-anim" onSubmit="{{ submit }}" style="position: absolute; left: 0; right: 0; top: 372px; padding: 0 24px; box-sizing: border-box; display: flex; flex-direction: column; gap: 18px; animation: aqFadeUp .8s .35s both">
<div style="display: flex; flex-direction: column; gap: 6px">
<h1 style="margin: 0; font-size: 24px; font-weight: 600; letter-spacing: -0.2px">Ingresa a Aquora</h1>
<div style="display: flex; height: 4px; width: 56px; border-radius: 2px; overflow: hidden"><span style="flex: 55; background: #2491CC"></span><span style="flex: 30; background: #88BD4C"></span><span style="flex: 15; background: #F3CB35"></span></div>
</div>

<div style="display: flex; flex-direction: column; gap: 8px">
<label for="aqm-email" style="font-size: 14px; font-weight: 500">Correo electrónico</label>
<div class="aq-field" style="position: relative">
<svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#7B8C99" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="position: absolute; left: 15px; top: 16px"><rect x="3" y="5" width="18" height="14" rx="2"></rect><path d="m3 7 9 6 9-6"></path></svg>
<input id="aqm-email" type="email" autocomplete="email" placeholder="nombre@empresa.co">
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 8px">
<label for="aqm-pass" style="font-size: 14px; font-weight: 500">Contraseña</label>
<div class="aq-field" style="position: relative">
<svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#7B8C99" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="position: absolute; left: 15px; top: 16px"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V7a4 4 0 0 1 8 0v4"></path></svg>
<input id="aqm-pass" type="{{ passType }}" autocomplete="current-password">
<button type="button" onClick="{{ togglePass }}" aria-label="{{ eyeLabel }}" style="position: absolute; right: 4px; top: 4px; width: 44px; height: 44px; border: 0; background: transparent; border-radius: 10px; cursor: pointer; display: flex; align-items: center; justify-content: center">
<sc-if value="{{ showPass }}" hint-placeholder-val="{{ false }}">
<svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#A9C0CF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3l18 18"></path><path d="M10.6 6.1A10 10 0 0 1 12 6c6 0 9.5 6 9.5 6a17 17 0 0 1-3 3.6M6.4 7.6A17 17 0 0 0 2.5 12S6 18 12 18a9.6 9.6 0 0 0 4-.9"></path></svg>
</sc-if>
<sc-if value="{{ hidePass }}" hint-placeholder-val="{{ true }}">
<svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#A9C0CF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 12S6 6 12 6s9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6z"></path><circle cx="12" cy="12" r="3"></circle></svg>
</sc-if>
</button>
</div>
<a href="#ayuda" style="align-self: flex-end; font-size: 13px; text-decoration: none; padding: 4px 0">¿Problemas para ingresar?</a>
</div>

<button type="submit" class="aq-btn" style="height: 54px; border: 0; border-radius: 12px; background: #1C6FA0; color: #FFFFFF; font: 600 16px Poppins, sans-serif; cursor: pointer">
<sc-if value="{{ loading }}" hint-placeholder-val="{{ false }}"><span>Ingresando…</span></sc-if>
<sc-if value="{{ idle }}" hint-placeholder-val="{{ true }}"><span>Ingresar</span></sc-if>
</button>

<p style="margin: 0; text-align: center; font-size: 14px; color: #A9C0CF">¿Aún no tienes cuenta? <a href="#registro" style="color: #A6D46E; font-weight: 500; text-decoration: none">Solicitar acceso</a></p>
</form>

<div style="position: absolute; left: 0; right: 0; bottom: 22px; display: flex; justify-content: center; align-items: center; gap: 8px; font-size: 12px; color: #A9C0CF">
<span class="aq-anim" aria-hidden="true" style="width: 7px; height: 7px; border-radius: 50%; background: #88BD4C; animation: aqPulse 2s ease-in-out infinite"></span>
<span>Servidor en línea · v1.2.4</span>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { showPass: false, loading: false };
  }
  renderVals() {
    const s = this.state;
    return {
      showPass: s.showPass,
      hidePass: !s.showPass,
      passType: s.showPass ? 'text' : 'password',
      eyeLabel: s.showPass ? 'Ocultar contraseña' : 'Mostrar contraseña',
      togglePass: () => this.setState({ showPass: !s.showPass }),
      loading: s.loading,
      idle: !s.loading,
      submit: (e) => {
        if (e && e.preventDefault) e.preventDefault();
        this.setState({ loading: true });
        setTimeout(() => this.setState({ loading: false }), 1800);
      },
    };
  }
}
</script>
</body>
</html>
