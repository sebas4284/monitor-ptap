# CI mínimo del monorepo: typecheck + lint + tests del API en cada push/PR.
#
# Dos decisiones deliberadas:
#  1. El runner descubre test/*.test.ts y test/*.test.cjs, sin una lista manual en package.json.
#     La lista manual ya nos mordió una vez (login.test.ts existía pero nunca se ejecutaba):
#     aquí, un archivo de test olvidado en package.json corre igual — no puede quedar invisible.
#  2. El runner Node fija TSX_TSCONFIG_PATH sin sintaxis específica de cmd.exe o del shell Unix.
#
# Los tests NO requieren MySQL (usan dobles; mysql2 aparece solo como tipos), así que no hay
# servicio de base de datos. Si algún día un test lo necesita, añadir `services: mysql`.
name: CI

permissions:
  contents: read

on:
  push:
    branches: [main, yosh]
  pull_request:
    branches: [main, yosh, guido]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instalar dependencias
        run: npm ci --ignore-scripts

      - name: Compilar contrato compartido
        run: npm run build -w @ptap/shared

      - name: Auditoría de dependencias del monorepo
        # DEP-01 usa una copia local corregida y atribuida; el test siguiente comprueba la
        # resolución efectiva de Expo y las cargas de contaminación de prototipo.
        run: npm audit --audit-level=low

      - name: Regresión de seguridad de dependencias locales
        run: npm run test:security:deps

      - name: Regresiones de herramientas de seguridad
        run: node --test tools/vm/*.test.cjs

      - name: Instalar herramienta PLC
        run: npm ci --ignore-scripts --prefix tools/plc-discovery

      - name: Auditoría de herramienta PLC
        run: npm audit --prefix tools/plc-discovery --audit-level=low

      - name: Typecheck (api + mobile + shared)
        run: npm run typecheck

      - name: Typecheck de pruebas del API
        run: npm run typecheck:tests -w @ptap/api

      - name: Lint (todos los workspaces)
        run: npm run lint

      - name: Typecheck herramienta PLC
        run: npm run typecheck --prefix tools/plc-discovery

      - name: Tests del móvil
        run: npm run test -w @ptap/mobile

      - name: Regresiones de entrega web
        run: npm run test:web-tools

      - name: Exportación web
        working-directory: apps/mobile
        env:
          CI: '1'
        run: npm run export:web

      - name: Tests del API (descubrimiento automático)
        run: npm test -w @ptap/api

  api-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instalar dependencias sin scripts
        run: npm ci --ignore-scripts

      - name: Compilar contrato compartido
        run: npm run build -w @ptap/shared

      - name: Typecheck de pruebas del API
        run: npm run typecheck:tests -w @ptap/api

      - name: Tests del API en Windows
        run: npm test -w @ptap/api
